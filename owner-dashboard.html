<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Owner Dashboard ⚡🔥</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #121212;
      color: #ffffff;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    .topnav {
      width: 100%;
      background: #1e1e1e;
      padding: 18px 10px;
      display: flex;
      justify-content: center;
      gap: 30px;
      border-bottom: 2px solid #ff9900;
    }

    .topnav a {
      color: #ff9900;
      font-size: 24px;
      font-weight: bold;
      text-decoration: none;
    }

    .topnav a:hover {
      color: #fff;
    }

    /* Logout Button */
    .logout-btn {
      background: #ff4444;
      color: #fff;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      border: none;
      margin-top: 20px;
    }

    .logout-btn:hover {
      background: #ff0000;
    }

    .owner-dashboard {
      margin-top: 50px;
      background: #1e1e1e;
      padding: 35px;
      border-radius: 18px;
      max-width: 1000px;
      margin-left: auto;
      margin-right: auto;
    }

    .owner-dashboard h2 {
      color: #ff9900;
      font-size: 38px;
      font-weight: 900;
      margin-bottom: 30px;
    }

    .owner-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .owner-card {
      background: #2a2a2a;
      padding: 20px;
      border-radius: 14px;
      border: 2px solid #ff9900;
      box-shadow: 0 0 10px rgba(255,153,0,0.25);
    }

    .owner-card h3 {
      color: #ff9900;
      font-size: 24px;
      margin-bottom: 10px;
    }

    .owner-card p {
      font-size: 18px;
      margin-bottom: 6px;
    }

    .btn {
      background: #ff9900;
      color: #000;
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      margin-right: 6px;
      margin-top: 8px;
    }

    .btn:hover {
      background: #ffffff;
    }
  </style>
</head>

<body>

  <!-- ⭐ LOGIN SCHUTZ -->
  <script>
    if (localStorage.getItem("ownerLoggedIn") !== "true") {
      window.location.href = "owner-login.html";
    }
  </script>

  <!-- HEADER -->
  <div class="topnav">
    <a href="/index.html">Startseite</a>
    <a href="/owner-dashboard.html">Owner Dashboard</a>
  </div>

  <!-- OWNER DASHBOARD -->
  <div class="owner-dashboard">
    <h2>Owner Dashboard ⚡🔥</h2>

    <div class="owner-grid">

      <div class="owner-card">
        <h3>Bot‑Status</h3>
        <p>Online: ❌</p>
        <p>Version: 1.0.0</p>
      </div>

      <div class="owner-card">
        <h3>Server‑Kontrolle</h3>
        <button class="btn">Bot Neustarten</button>
        <button class="btn">Cache Leeren</button>
      </div>

      <div class="owner-card">
        <h3>Moderation</h3>
        <p>Warnungen ansehen</p>
        <p>Bans verwalten</p>
        <p>Logs öffnen</p>
      </div>

      <div class="owner-card">
        <h3>RP‑System</h3>
        <p>Charaktere verwalten</p>
        <p>Energie‑System</p>
        <p>RP‑Aktionen</p>
      </div>

      <div class="owner-card">
        <h3>System‑Tools</h3>
        <p>API‑Keys</p>
        <p>Debug‑Modus</p>
        <p>System‑Konfiguration</p>
      </div>

    </div>

    <!-- ⭐ LOGOUT BUTTON -->
    <button class="logout-btn" onclick="logout()">Logout</button>

  </div>

  <script>
    function logout() {
      localStorage.removeItem("ownerLoggedIn");
      window.location.href = "owner-login.html";
    }
  </script>

</body>
</html>
